name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Signed release APK
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v6

      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.OPENKEYS_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then echo "::error::OPENKEYS_KEYSTORE_BASE64 secret is not set"; exit 1; fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Test and build release APK
        env:
          OPENKEYS_KEYSTORE: ${{ runner.temp }}/release.jks
          OPENKEYS_KEYSTORE_PASSWORD: ${{ secrets.OPENKEYS_KEYSTORE_PASSWORD }}
          OPENKEYS_KEY_ALIAS: ${{ secrets.OPENKEYS_KEY_ALIAS }}
          OPENKEYS_KEY_PASSWORD: ${{ secrets.OPENKEYS_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew testReleaseUnitTest assembleRelease

      - name: Verify signature
        run: |
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          APK="app/build/outputs/apk/release/app-release.apk"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          cp "$APK" "OpenKeys-${GITHUB_REF_NAME}.apk"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "OpenKeys-${GITHUB_REF_NAME}.apk" --title "OpenKeys $GITHUB_REF_NAME" --generate-notes

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"
